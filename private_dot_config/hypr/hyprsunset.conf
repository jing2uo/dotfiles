# ~/.config/hypr/hyprsunset.conf
# hyprsunset 蓝光过滤 / 色温与亮度调节
# 文档: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# 工作原理:
#   - 用 profile 定义不同时间点的色温(temperature)和亮度(gamma)。
#   - 每个 profile 在它的 time 时间点被激活,并重置其它 profile 设置的所有选项。
#   - 启动时会自动应用"当前时间所属"的那个 profile。
#   - profile 数量不限,按需增减。

# gamma 允许的最大百分比 (绝对上限 200)。
# 设成 150 主要是为了用 IPC/快捷键把亮度往上调时能超过 100%。
max-gamma = 150

# ── 白天: 中性色温,无明显蓝光过滤 ──
profile {
    time = 7:00
    temperature = 6500   # 接近自然日光,基本无暖色
    gamma = 1.0          # 正常亮度
}

# ── 傍晚: 轻度暖色,减轻蓝光 ──
profile {
    time = 19:00
    temperature = 4500
    gamma = 1.0
}

# ── 夜间: 强暖色 + 略微压暗 ──
profile {
    time = 22:00
    temperature = 3500
    gamma = 0.9          # 比显示器最低亮度再暗一点,护眼
}
