[tools]
chezmoi = "latest"
claude = "latest"
duckdb = "latest"
github-cli = "latest"
"github:daeuniverse/daed" = { version = "latest", version_prefix = "v" }
"github:e-tho/bzmenu" = "latest"
"github:e-tho/iwmenu" = "latest"
"github:jing2uo/kontext" = "latest"
go = "latest"
herdr = "latest"
kind = "latest"
node = "latest"
pi = "latest"
pulumi = "latest"
rust = "latest"
usage = "latest"
uv = "latest"
wrangler = "latest"
yt-dlp = "latest"

[settings]
minimum_release_age = "0"

[hooks]
# rust 用 latest,mise 每次升级版本就漂。走 mise 的场景 (mise activate 的终端) 靠
# RUSTUP_TOOLCHAIN=<mise pin> 自然一致;但不走 mise 的场景 (IDE / CI / 别的 shell) 退回
# rustup default,若它不跟 mise,两边编译器版本不同 → cargo 反复重编 (fingerprint 失效)。
# 每次 tool 装完把 rustup default 对齐到 mise 当前 rust,保证走不走 mise 都是同一版本。
# 幂等 (rustup default 重设无害),故不必只在 rust 变化时跑。
postinstall = 'rustup default "$(mise current rust 2>/dev/null)" 2>/dev/null || true'
