[env]
TERM = "xterm-256color"

[font]
size = 14.0
builtin_box_drawing = true

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.bold]
family = "IosevkaTerm Nerd Font"
style = "Bold"

[window]
#dynamic_title = false
opacity = 0.95
startup_mode = "Maximized"

[window.padding]
x = 2
y = 2
