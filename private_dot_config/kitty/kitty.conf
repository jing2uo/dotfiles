# kitty config

# [font]
font_family      IosevkaTerm Nerd Font
font_size        14.0

# IosevkaTerm has ligatures via calt (-> != == ...); split them under the cursor
disable_ligatures cursor

# Colors (kitty default bg is pure #000000, too dark)
include theme.conf

# [window] opacity
background_opacity 0.95

# padding in pt
window_padding_width 1.5

# [window] startup_mode = "Maximized" dropped: Hyprland tiles anyway

# herdr is a persistent server; closing the kitty window only detaches the client
confirm_os_window_close 0
